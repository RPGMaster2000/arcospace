name: Godot regression tests
on:
  push:
    branches: [main, refactor/starfront-preparation, checkpoint/pressure-exploration-v01, codex/unique-ship-models, codex/expedition-progression-validation, codex/music-emp-pulse]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Test regression runner
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Import and run all regression scripts
        run: python3 tools/run_regressions.py --godot Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-test-results
          path: test-results/


  rendered-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        renderer: [gl_compatibility, mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software renderers
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
      - name: Run recurring rendered suite
        shell: bash
        env:
          RENDERER: ${{ matrix.renderer }}
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          if [ "$RENDERER" = mobile ]; then
            for icd in /usr/share/vulkan/icd.d/*lvp*; do export VK_ICD_FILENAMES="$icd"; done
          fi
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/run_rendered_regressions.py --godot Godot_v4.7.2-stable_linux.x86_64 --renderer "$RENDERER" --results "test-results/rendered-$RENDERER"
      - name: Check lens effects from exported pack
        shell: bash
        env:
          RENDERER: ${{ matrix.renderer }}
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          if [ "$RENDERER" = mobile ]; then
            for icd in /usr/share/vulkan/icd.d/*lvp*; do export VK_ICD_FILENAMES="$icd"; done
          fi
          GODOT=Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --export-pack Web "$RUNNER_TEMP/lens.pck" > test-results/lens-export.log 2>&1
          status=0
          timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --display-driver x11 --rendering-method "$RENDERER" --audio-driver Dummy --main-pack "$RUNNER_TEMP/lens.pck" --script res://tests/star_system_lens_effects_test.gd -- "$RENDERER" > test-results/lens-packed.log 2>&1 || status=$?
          cat test-results/lens-packed.log
          if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR|ERROR:|[1-9][0-9]* failures' test-results/lens-export.log test-results/lens-packed.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-${{ matrix.renderer }}-results
          path: |
            test-results/
            .godot/testlogs/

  exported-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and software rendering
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Test real menu to battle from source and exported pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          export LIBGL_ALWAYS_SOFTWARE=1
          GODOT=Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import --quit > test-results/startup-import.log 2>&1
          "$GODOT" --headless --path . --export-pack Web "$RUNNER_TEMP/startup.pck" > test-results/startup-export.log 2>&1
          for mode in source packed; do
            args=(--path .)
            if [ "$mode" = packed ]; then args=(--main-pack "$RUNNER_TEMP/startup.pck"); fi
            status=0
            timeout 150 xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy "${args[@]}" --script res://tests/startup_flow_test.gd > "test-results/startup-$mode.log" 2>&1 || status=$?
            cat "test-results/startup-$mode.log"
            if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR|ERROR:|[1-9][0-9]* failures' "test-results/startup-$mode.log"; then exit 1; fi
          done
      - name: Validate and capture independent ship models
        shell: bash
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          GODOT=Godot_v4.7.2-stable_linux.x86_64
          for mode in headless rendered; do
            status=0
            if [ "$mode" = headless ]; then
              timeout 120 "$GODOT" --headless --path . --script tests/ship_models_test.gd > "test-results/models-$mode.log" 2>&1 || status=$?
            else
              timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --display-driver x11 --rendering-method gl_compatibility --audio-driver Dummy --path . --script tests/ship_models_test.gd > "test-results/models-$mode.log" 2>&1 || status=$?
            fi
            cat "test-results/models-$mode.log"
            if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR|ERROR:|[1-9][0-9]* failures' "test-results/models-$mode.log"; then exit 1; fi
          done
          cp -r .godot/testlogs test-results/ship-model-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exported-startup-results
          path: test-results/
