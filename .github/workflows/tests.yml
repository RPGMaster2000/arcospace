name: Godot regression tests
on:
  push:
    branches: [main, codex/expedition-progression-validation, codex/music-emp-pulse]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/godot.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
      - name: Import and run all regression scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          GODOT=Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import --quit > test-results/import.log 2>&1
          if grep -Eq 'SCRIPT ERROR|Parse Error|Compile Error' test-results/import.log; then cat test-results/import.log; exit 1; fi
          # Catch progression fixture failures before waiting for the full regression suite.
          status=0
          timeout 120 "$GODOT" --headless --path . --script tests/expedition_milestones_test.gd > test-results/progression-focus.log 2>&1 || status=$?
          cat test-results/progression-focus.log
          if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR|[1-9][0-9]* failures|Assertion failed' test-results/progression-focus.log; then exit 1; fi
          failed=0
          for script in tests/*_test.gd; do
            name="$(basename "$script" .gd)"
            status=0
            timeout 120 "$GODOT" --headless --path . --script "$script" > "test-results/$name.log" 2>&1 || status=$?
            if [ "$status" -ne 0 ] || grep -Eq 'SCRIPT ERROR|[1-9][0-9]* failures|Assertion failed' "test-results/$name.log"; then
              echo "FAIL $name ($status)"
              cat "test-results/$name.log"
              failed=1
            else
              echo "PASS $name"
            fi
          done
          exit "$failed"
      - name: Check rendered landscape UI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          export LIBGL_ALWAYS_SOFTWARE=1
          GODOT=Godot_v4.7.2-stable_linux.x86_64
          for script in tests/power_allocation_test.gd tests/expedition_milestones_test.gd tests/star_map_test.gd tests/battlefield_environments_test.gd tests/field_repairs_ui_test.gd tests/repair_selection_test.gd tests/six_ship_profiles_test.gd tests/chasedown_ui_test.gd tests/deck_replacement_ui_test.gd tests/card_inspection_test.gd; do
            name="$(basename "$script" .gd)"
            xvfb-run -a -s "-screen 0 1920x1080x24" "$GODOT" --display-driver x11 --rendering-method gl_compatibility --path . --script "$script" > "test-results/render-$name.log" 2>&1
            if grep -Eq 'SCRIPT ERROR|[1-9][0-9]* failures|Assertion failed' "test-results/render-$name.log"; then cat "test-results/render-$name.log"; exit 1; fi
            cat "test-results/render-$name.log"
          done
          cp -r .godot/testlogs test-results/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-test-results
          path: test-results/
